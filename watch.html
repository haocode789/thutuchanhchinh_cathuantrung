<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem video hướng dẫn</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f3f7fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b}
.bar{background:linear-gradient(135deg,#0f2942,#1d4e89);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
.bar h1{font-size:1.05rem;font-weight:800;margin:0;flex:1;line-height:1.3}
.vid{position:relative;padding-bottom:56.25%;height:0;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(15,41,66,.2)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.steps{list-style:none;counter-reset:st;margin:0;padding:0}
.steps li{counter-increment:st;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:8px;line-height:1.5}
.steps li:before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:#1d5fd6;color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.tip{background:#e8f0fe;color:#164bb0;border-radius:12px;padding:10px 14px;font-size:.9rem}
</style>
</head>
<body>
<div class="bar"><h1 id="title">Đang tải...</h1><button class="btn btn-sm btn-light fw-bold" onclick="window.close()">Đóng</button></div>
<div class="container-fluid p-3" style="max-width:900px">
  <div id="msg" class="text-center text-muted py-5">Đang tải video hướng dẫn...</div>
  <div id="content" style="display:none">
    <div class="vid mb-3"><iframe id="video" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe></div>
    <div class="tip mb-3"><b>Mẹo:</b> làm thủ tục ở cửa sổ bên cạnh, xem đến bước nào thì làm bước đó. Có thể tạm dừng video bất cứ lúc nào.</div>
    <div id="stepsBox" style="display:none"><h2 class="h6 fw-bold text-primary mb-2">Trình tự thực hiện</h2><ol class="steps" id="steps"></ol></div>
  </div>
</div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const msg=document.getElementById('msg');
  if(!id){msg.textContent='Thiếu mã thủ tục.';return;}
  try{
    const d=await(await fetch('/api/procedures/'+encodeURIComponent(id))).json();
    if(!d.success||!d.data){msg.textContent='Không tìm thấy thủ tục này.';return;}
    const p=d.data;
    document.title=p.title+' - Video hướng dẫn';
    document.getElementById('title').textContent=p.title;
    document.getElementById('video').src=p.video_url||'';
    const steps=String(p.steps||'').split(/\r?\n/).map(s=>s.trim().replace(/^(?:bước\s*)?\d+\s*[.):\-–]\s*/i,'')).filter(Boolean);
    if(steps.length){document.getElementById('stepsBox').style.display='block';document.getElementById('steps').innerHTML=steps.map(s=>'<li><span>'+esc(s)+'</span></li>').join('');}
    msg.style.display='none';document.getElementById('content').style.display='block';
  }catch(e){msg.textContent='Không tải được video. Vui lòng thử lại.';}
})();
</script>
</body>
</html>
